services:
  web:
    build:
      context: ./apps/web
    ports:
      - "5173:5173"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vk_tooling
      POSTGRES_USER: vk
      POSTGRES_PASSWORD: vk_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  odoo-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo_password
    volumes:
      - odoo_db_data:/var/lib/postgresql/data

  odoo:
    image: odoo:17
    restart: unless-stopped
    depends_on:
      - odoo-db
    ports:
      - "8069:8069"
    environment:
      HOST: odoo-db
      USER: odoo
      PASSWORD: odoo_password
    volumes:
      - odoo_data:/var/lib/odoo
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  odoo_db_data:
  odoo_data:
