services:
  web:
    build:
      context: ./apps/web
    ports:
      - "5173:5173"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vk_tooling
      POSTGRES_USER: vk
      POSTGRES_PASSWORD: vk_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
